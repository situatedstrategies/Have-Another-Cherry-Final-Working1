# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure
#
# One backend, one project (gen-lang-client-0987674990). A `secret:` reference
# added here must already exist in that project's Secret Manager, because App
# Hosting resolves every declared secret at build time and a missing one fails
# the whole rollout rather than being skipped.
#
# The password wall in server/index.ts is off by default. To put it back:
#   - variable: SITE_GATE_ENABLED
#     value: "1"
#     availability:
#       - RUNTIME

env:
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESET_RESEND_API
    secret: RESET_RESEND_API
    availability:
      - RUNTIME

  # Waitlist mirror into Notion. The token must already exist in Secret Manager
  # before this config rolls out: App Hosting resolves every declared secret at
  # build time and fails the whole rollout if one is missing, so declaring a
  # secret you have not set yet takes the site down rather than degrading.
  #
  #   firebase apphosting:secrets:set NOTION_TOKEN --project gen-lang-client-0987674990
  #
  # The database ID is a plain value: it is a pointer, not a credential, and it
  # is useless to anyone without the token. With NOTION_TOKEN unset the mirror
  # is a no-op by design (server/notion.ts), so signups still land by email.
  - variable: NOTION_TOKEN
    secret: NOTION_TOKEN
    availability:
      - RUNTIME
  - variable: NOTION_WAITLIST_DB_ID
    value: bf32909e-e162-429e-a854-165cb86158ac
    availability:
      - RUNTIME

  # Associated domains (universal links + shared password autofill with the
  # iOS app). A plain value, not a secret: it is served publicly in the
  # apple-app-site-association file by design. This is the Situated
  # Strategies LLC Apple Developer Team ID from developer.apple.com ->
  # Membership details.
  - variable: APPLE_TEAM_ID
    value: 4964KRMB5H
    availability:
      - RUNTIME

  # Cherry + web billing, via RevenueCat Web Billing (Stripe).
  #
  # A PUBLIC SDK key, not a secret: RevenueCat issues `strp_` keys for client
  # code exactly as it issues `appl_` for the iOS app, and it carries no write
  # access to the account. A plain `value:` rather than a `secret:` for that
  # reason, and because a missing `secret:` fails the rollout.
  #
  # It must be BUILD availability: Vite inlines VITE_* at build time, so a
  # RUNTIME-only variable reaches the server and never the bundle.
  #
  # Setting this is what turns web selling ON. With it empty, CherryPlusModal
  # shows the waitlist and the where-to-buy note; with it set, the same modal
  # offers the plans through RevenueCat's hosted checkout. See src/lib/billing.ts.
  #
  # The iOS app is unaffected and must stay that way: it sells through StoreKit
  # only and may never mention or link to web purchasing. Apple guideline 3.1.1.
  - variable: VITE_RC_WEB_KEY
    value: strp_GBmLXMFpmQLojqqIGsZwCvRYjLT
    availability:
      - BUILD
      # RUNTIME too: the server's entitlement sync (server/revenuecat.ts)
      # asks RevenueCat about a subscriber with this same public key, which
      # is what makes a purchase survive sign-out when the webhook does not
      # arrive. A REVENUECAT_API_KEY secret, if ever added, takes precedence.
      - RUNTIME

  # Cherry + promo allowlist: sign-in emails that get Cherry + without paying.
  # The owner, the App Store and Play review accounts, and anyone else the
  # owner names. Read by /api/plus-promo-sync in server/routes/billing.ts, which every client
  # calls after sign-in; removing an address here revokes on their next
  # sign-in. Everyone not on this list sees the paywall. A plain value: these
  # are addresses, not credentials.
  - variable: PLUS_PROMO_EMAILS
    value: "mata.olivias@gmail.com,bcallahan121@gmail.com,demo+apple@haveanothercherry.com,demo+google@haveanothercherry.com,demo+two@haveanothercherry.com"
    availability:
      - RUNTIME

  # Cherry + entitlement webhook. RevenueCat POSTs every subscription event to
  # /api/revenuecat-webhook with this exact string in its Authorization header,
  # and the server mirrors the entitlement onto users/{uid}.isPlus. Until it is
  # set the endpoint answers 503, a web purchase charges the card and unlocks
  # only the current page load, and nothing durable happens. It lives in
  # Secret Manager, like every other secret in this file.
  #
  #   firebase apphosting:secrets:set REVENUECAT_WEBHOOK_AUTH --project gen-lang-client-0987674990
  #
  # Then paste the same value under Authorization header in RevenueCat ->
  # Integrations -> Webhooks, pointed at
  # https://app.haveanothercherry.com/api/revenuecat-webhook
  - variable: REVENUECAT_WEBHOOK_AUTH
    secret: REVENUECAT_WEBHOOK_AUTH
    availability:
      - RUNTIME

  # Scheduled bill reminders. Cloud Scheduler POSTs daily to
  # /api/send-bill-reminders with a shared secret in an x-cherry-cron header.
  #
  # REMINDER_CRON_SECRET is deliberately NOT declared here. Declaring it as a
  # `secret:` before it existed failed the rollout, exactly as the warning at
  # the top of this file says it would. The endpoint's own fail-closed
  # behaviour, a 503 while the secret is absent, is about runtime and does not
  # help here.
  #
  # To turn reminders on, do it in this order:
  #   1. firebase apphosting:secrets:set REMINDER_CRON_SECRET --project gen-lang-client-0987674990
  #   2. only then add the `secret:` block back here
  # Until step 2, the endpoint answers 503 and no reminder is sent, which is
  # the intended state while the schedule is not live.

  # Which zone "due tomorrow" is reckoned in, as an offset from UTC. Due dates
  # carry no time of day by design, so the reminder has to pick an hour, and
  # the scheduler should be set for the early evening of this zone. Per
  # household zones would mean the server learning where people live, which is
  # a worse trade than a reminder landing a few hours off. -4 is US Eastern in
  # summer; leave unset for UTC.
  - variable: REMINDER_TZ_OFFSET_HOURS
    value: "-4"
    availability:
      - RUNTIME

  # App Store server notifications relay target. Set this to RevenueCat's
  # Apple server-to-server notification URL (RevenueCat dashboard -> the
  # Apple app's settings) so purchase events Apple sends to our domain are
  # passed through to the processor that owns entitlements. A plain value:
  # the URL contains no credentials RevenueCat does not already publish to
  # the app. Until set, the endpoint acknowledges and logs without
  # forwarding.
  # - variable: APPLE_ASN_FORWARD_URL
  #   value: https://api.revenuecat.com/...
  #   availability:
  #     - RUNTIME
